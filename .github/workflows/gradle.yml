# CI build for temple of gloom project

name: CI Build Temple of Gloom

# trigger build on PRs to main
on:
  push:
    branches:
      - main
  pull_request_target:
    types: [assigned, opened, synchronize , reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # pull the latest code
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # fetch Java
      - name: Set up JDK 20
        uses: actions/setup-java@v3
        with:
          java-version: '20'
          distribution: 'temurin'

      # Validate the checksums of Gradle Wrapper JAR files present in the source tree
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      # build using gradle
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build

      # run tests using gradle
      - name: Run Tests
        run: ./gradlew test

      # run code coverage using Jacaco
      - name: Run Test Coverage
        run: ./gradlew jacocoTestReport

      # generate Jacaco badge
      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-coverage-endpoint: true
          jacoco-csv-file: "**/jacocoTestReport.csv"

      # output build artifacts i.e. JARs
      - uses: actions/upload-artifact@v3
        with:
          name: Package
          path: temple/build/libs

      # output detailed code coverage report
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v3
        with:
          name: Code Coverage
          path: "**/build/reports/jacoco/test/html"
